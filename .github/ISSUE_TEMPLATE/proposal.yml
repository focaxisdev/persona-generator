name: Proposal
description: Propose a bounded documentation or protocol change.
title: "[Proposal]: "
labels: ["proposal"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why is this useful within the current Markdown-first scope?
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmations
      options:
        - label: This does not add an app, CLI, API, backend, database, telemetry, dependency, or hosted service.
          required: true
        - label: This does not add a static persona catalog.
          required: true
        - label: This does not broaden the project into real-person profiling or high-stakes use.
          required: true
