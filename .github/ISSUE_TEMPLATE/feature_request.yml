name: Feature request
description: Request a bounded documentation, template, or fictional-example improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: request
    attributes:
      label: Request
      description: What improvement do you want?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: How does this stay within Markdown-first, fictional, low-stakes use?
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: This does not request an app, CLI, API, backend, database, telemetry, dependency, or hosted service.
          required: true
        - label: This does not request real-person profiling, diagnosis, scoring, covert profiling, static persona catalogs, or unsupported high-stakes use.
          required: true
        - label: This does not include personal data, sensitive data, secrets, credentials, or private files.
          required: true
