name: Source note or citation
description: Propose a bounded source note or citation clarification.
title: "[Source note]: "
labels: ["documentation", "source-note"]
body:
  - type: textarea
    id: citation
    attributes:
      label: Citation details
      description: Provide exact bibliographic details, DOI, URL, or access notes where available.
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: Claim boundary
      description: What limited vocabulary or boundary does this support?
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Proposed status
      options:
        - verified
        - partial
        - source-gap
        - do-not-use
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: This does not claim psychometric validation, diagnosis, real-person prediction, or unsupported high-stakes suitability.
          required: true
        - label: This does not include fabricated citation details.
          required: true
        - label: This does not include personal data, sensitive data, secrets, credentials, private files, covert profiling requests, or static persona catalog proposals.
          required: true
