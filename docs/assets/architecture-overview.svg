<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Persona Generator architecture overview</title>
  <desc id="desc">A grammar-first flow from fictional scenario brief through bounded constructs, ephemeral fictional personas, manual review, optional panel adapter, optional Persona Pack serialization, handoff, and stop.</desc>
  <defs>
    <style>
      text { font-family: system-ui, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .bg { fill: #f7f4ee; }
      .panel { fill: #ffffff; stroke: #1c5f66; stroke-width: 3; rx: 14; }
      .optional { fill: #fff7dc; stroke: #9b6a00; stroke-width: 3; stroke-dasharray: 12 9; rx: 14; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 21px; fill: #42515f; }
      .node-title { font-size: 22px; font-weight: 700; }
      .node-copy { font-size: 16px; fill: #43505f; }
      .badge { fill: #e5f0ef; stroke: #1c5f66; stroke-width: 2; rx: 18; }
      .badge-text { font-size: 16px; font-weight: 650; fill: #164e54; }
      .arrow { stroke: #1c5f66; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .arrow-optional { stroke: #9b6a00; stroke-width: 4; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrowheadOptional); }
      .stop { fill: #2e2b26; }
      .stop-text { fill: #ffffff; font-size: 22px; font-weight: 750; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1c5f66" />
    </marker>
    <marker id="arrowheadOptional" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#9b6a00" />
    </marker>
  </defs>

  <rect class="bg" width="1280" height="720" />
  <text class="title" x="64" y="72">Persona Generator</text>
  <text class="subtitle" x="64" y="108">Generate academically bounded fictional personas on demand for multi-agent rehearsal.</text>

  <rect class="badge" x="64" y="136" width="120" height="38" />
  <text class="badge-text" x="88" y="161">fictional</text>
  <rect class="badge" x="200" y="136" width="132" height="38" />
  <text class="badge-text" x="222" y="161">low-stakes</text>
  <rect class="badge" x="348" y="136" width="158" height="38" />
  <text class="badge-text" x="371" y="161">Markdown-first</text>
  <rect class="badge" x="522" y="136" width="244" height="38" />
  <text class="badge-text" x="548" y="161">human judgment final</text>

  <rect class="panel" x="64" y="230" width="220" height="118" />
  <text class="node-title" x="88" y="270">Scenario Brief</text>
  <text class="node-copy" x="88" y="300">fictional context</text>
  <text class="node-copy" x="88" y="324">purpose and limits</text>

  <rect class="panel" x="360" y="230" width="230" height="118" />
  <text class="node-title" x="384" y="270">Bounded Constructs</text>
  <text class="node-copy" x="384" y="300">source-note aware</text>
  <text class="node-copy" x="384" y="324">qualitative anchors</text>

  <rect class="panel" x="666" y="230" width="236" height="118" />
  <text class="node-title" x="690" y="270">Ephemeral Personas</text>
  <text class="node-copy" x="690" y="300">temporary specs</text>
  <text class="node-copy" x="690" y="324">not a catalog</text>

  <rect class="panel" x="978" y="230" width="226" height="118" />
  <text class="node-title" x="1002" y="270">Manual Review</text>
  <text class="node-copy" x="1002" y="300">Pass / Revise / Block</text>
  <text class="node-copy" x="1002" y="324">safety gate</text>

  <path class="arrow" d="M284 289 H350" />
  <path class="arrow" d="M590 289 H656" />
  <path class="arrow" d="M902 289 H968" />

  <rect class="optional" x="118" y="464" width="240" height="122" />
  <text class="node-title" x="142" y="504">Panel Adapter</text>
  <text class="node-copy" x="142" y="534">optional bridge</text>
  <text class="node-copy" x="142" y="558">dissent preserved</text>

  <rect class="optional" x="448" y="464" width="240" height="122" />
  <text class="node-title" x="472" y="504">Persona Pack</text>
  <text class="node-copy" x="472" y="534">optional serialization</text>
  <text class="node-copy" x="472" y="558">portable Markdown</text>

  <rect class="optional" x="778" y="464" width="240" height="122" />
  <text class="node-title" x="802" y="504">Handoff / Reload</text>
  <text class="node-copy" x="802" y="534">exact-file package</text>
  <text class="node-copy" x="802" y="558">fresh-agent review</text>

  <rect class="stop" x="1098" y="476" width="106" height="98" rx="14" />
  <text class="stop-text" x="1130" y="533">Stop</text>

  <path class="arrow-optional" d="M1091 348 C1091 420 278 396 238 454" />
  <path class="arrow-optional" d="M358 525 H438" />
  <path class="arrow-optional" d="M688 525 H768" />
  <path class="arrow-optional" d="M1018 525 H1088" />

  <text class="subtitle" x="64" y="664">Default runtime: scenario brief -&gt; bounded grammar -&gt; temporary fictional specs -&gt; manual review -&gt; stop.</text>
</svg>
